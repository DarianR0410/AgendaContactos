    <main>
        <div class="container mt-3">
            <section>
                <div class="row d-flex justify-content-center">
                        <div class="col-12 col-sm-4">
                            <div class="card">
                                <div class="card-header bg-primary text-light">
                                    <h5 class="text-center">New contact</h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label for="name" class="form-label">Name</label>
                                            <input type="text" id ="name" class="form-control">
                                    </div>
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">Phone</label>
                                            <input type="text" id ="phone" class="form-control">
                                    </div>
                                            <div class="mb-3">
                                            <label for="picture" class="form-label">Picture URL</label>
                                            <input type="text" id ="picture" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                            <label for="contact-type" class="form-label">Contact type:</label>
                                            <select name="contact-type" id="contact-type" class="form-select">
                                                <option value="">Select some option</option>
                                                <option value="Academy">Academy</option>
                                                <option value="Office">Office</option>
                                                <option value="Casual">Casual</option>
                                            </select>
                                            <div>
                                                <button id="save-button" onclick="GenerateHtmlContact()" class=" btn btn-outline-primary float-end ms-2 mt-4">Save</button>
                                                <button id="clear-button" onclick="Clear()" class=" btn btn-outline-warning float-end me-2 mt-4">Clear</button>
                                            </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                </div>
            </section>
